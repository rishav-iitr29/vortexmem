<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VortexMem Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-bold mb-2">VortexMem: Live Telemetry</h1>
        <p class="text-gray-400 mb-8">Real-Time Memory & Cache Hierarchy Visualization</p>

        <div class="grid grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                <h3 class="text-gray-400 text-sm uppercase tracking-wider">System AMAT</h3>
                <p id="ui-amat" class="text-3xl font-bold text-blue-400">0.00 cyc</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                <h3 class="text-gray-400 text-sm uppercase tracking-wider">External Fragmentation</h3>
                <p id="ui-frag" class="text-3xl font-bold text-red-400">0.00%</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                <h3 class="text-gray-400 text-sm uppercase tracking-wider">L1 Cache Hit Rate</h3>
                <p id="ui-hits" class="text-3xl font-bold text-green-400">0.00%</p>
            </div>
        </div>

        <h2 class="text-2xl font-bold mb-4">Physical Memory Layout (1024B Base)</h2>
        <div id="memory-map" class="flex w-full h-32 bg-gray-800 rounded-lg overflow-hidden border border-gray-700"></div>
    </div>

    <script>
        const TOTAL_MEMORY = 1024;

        async function fetchSnapshot() {
            try {
                const response = await fetch('/api/snapshot');
                const { metrics, blocks } = await response.json();

                // Update Metrics text instantly
                document.getElementById('ui-amat').innerText = `${metrics.amat.toFixed(2)} cyc`;
                document.getElementById('ui-frag').innerText = `${metrics.fragmentation.toFixed(2)}%`;
                document.getElementById('ui-hits').innerText = `${metrics.l1_hit_rate.toFixed(2)}%`;

                // Map array data directly into HTML string slices and insert them all at once
                document.getElementById('memory-map').innerHTML = blocks.map(block => {
                    const pct = (block.size / TOTAL_MEMORY) * 100;
                    const bgClass = block.is_free ? "bg-gray-700 text-gray-400" : "bg-blue-600 text-white font-bold";
                    const label = block.is_free ? `Free: ${block.size}B` : `ID ${block.id}<br>${block.size}B`;

                    return `<div class="flex items-center justify-center border-r border-gray-900 text-xs font-mono transition-all duration-300 text-center ${bgClass}" 
                                 style="width: ${pct}%">
                                 ${label}
                            </div>`;
                }).join('');

            } catch (err) {
                console.warn("Backend link pending...");
            }
        }

        setInterval(fetchSnapshot, 500);
    </script>
</body>
</html>
